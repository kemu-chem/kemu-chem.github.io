<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protocol Flowchart</title>
  <style>
    :root { --primary: #2563eb; --border: #e2e8f0; --bg: #f8fafc; --panel-w: 280px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      background: white;
      border-bottom: 1px solid var(--border);
      align-items: center;
      flex-shrink: 0;
    }
    .tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
    .tb-label { font-size: 11px; color: #94a3b8; letter-spacing: 0.04em; text-transform: uppercase; }
    .tb-btn {
      padding: 5px 11px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 5px;
      background: white; cursor: pointer; color: #334155; white-space: nowrap;
      transition: background 0.1s, border-color 0.1s;
    }
    .tb-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .tb-btn.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
    .tb-btn.danger { color: #dc2626; }
    .tb-btn.danger:hover { background: #fef2f2; border-color: #fca5a5; }
    #title-input {
      border: none; outline: none; font-size: 13px; font-weight: 600;
      color: #334155; background: transparent; width: 200px;
      padding: 4px 6px; border-radius: 4px;
    }
    #title-input:focus { background: #f1f5f9; }

    /* ── Main ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    #canvas-container {
      flex: 1; position: relative; overflow: hidden;
      background-color: #f8f8f8;
      background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    #editor-svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
    #editor-svg.panning { cursor: grabbing; }
    .hover-action { fill: #2563eb; fill-opacity: 0.2; transition: fill-opacity 0.15s; }
    .hover-action:hover { fill-opacity: 0.65; }

    /* ── Panel ── */
    #panel-container {
      width: var(--panel-w); flex-shrink: 0;
      background: white; border-left: 1px solid var(--border);
      overflow-y: auto; padding: 14px;
    }
    .panel-empty { color: #94a3b8; font-size: 13px; margin-top: 20px; text-align: center; }

    /* ── Inline text editor ── */
    #inline-edit {
      position: fixed; display: none; resize: none; overflow: hidden;
      border: 2px solid var(--primary); border-radius: 4px;
      padding: 4px 8px; text-align: center; background: white;
      z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,.18);
      outline: none; line-height: 1.4; box-sizing: border-box;
    }

    /* ── Status bar ── */
    #statusbar {
      font-size: 11px; color: #94a3b8;
      padding: 3px 12px; background: white;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
  </style>

  <!-- pptxgenjs CDN (global PptxGenJS) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs/dist/pptxgen.bundle.js"></script>
  <!-- Editor entry point -->
  <script type="module" src="src/protocol_flowchart/ui/editor.js"></script>
</head>
<body>

<div id="toolbar">
  <input id="title-input" type="text" value="Protocol Flowchart" placeholder="Title">
  <div class="tb-sep"></div>

  <button class="tb-btn" id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
  <button class="tb-btn" id="btn-redo" title="Redo (Ctrl+Y)">↪ Redo</button>
  <div class="tb-sep"></div>

  <span class="tb-label">Edit</span>
  <button class="tb-btn" id="btn-add-node">+ Add Node</button>
  <button class="tb-btn" id="btn-branch-up">↑ Branch Up</button>
  <button class="tb-btn" id="btn-branch-down">↓ Branch Down</button>
  <button class="tb-btn" id="btn-connect-mode">→ Connect</button>
  <button class="tb-btn" id="btn-select-all-nodes">Select All Nodes</button>
  <button class="tb-btn" id="btn-select-all-edges">Select All Edges</button>
  <button class="tb-btn" id="btn-select-component">Select Component</button>
  <button class="tb-btn" id="btn-merge">Merge Nodes</button>
  <button class="tb-btn danger" id="btn-delete">Delete</button>
  <div class="tb-sep"></div>

  <span class="tb-label">View</span>
  <button class="tb-btn" id="btn-relayout">Reset Layout</button>
  <button class="tb-btn active" id="btn-snap">Snap</button>
  <input id="snap-step" type="number" min="0.01" max="1" step="0.05"
    title="Snap Step"
    style="width:58px;padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;color:#334155;">
  <button class="tb-btn active" id="btn-grid-snap">Grid</button>
  <input id="grid-size" type="number" min="1" max="200" step="1"
    title="Grid size (px)"
    style="width:52px;padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;color:#334155;">
  <span class="tb-label">Padding</span>
  <input id="pad-input" type="number" value="8" min="0" max="60" step="1"
    title="Node padding (px)"
    style="width:52px;padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:4px;color:#334155;">
  <div class="tb-sep"></div>

  <span class="tb-label">Font</span>
  <select id="font-select" style="padding:4px 6px;font-size:13px;border:1px solid var(--border);border-radius:4px;color:#334155;background:white;cursor:pointer;">
    <option value="sans-serif">Sans-serif</option>
    <option value="serif">Serif</option>
    <option value="monospace">Monospace</option>
    <option value="Arial">Arial</option>
    <option value="Helvetica">Helvetica</option>
    <option value="Times New Roman">Times New Roman</option>
    <option value="Georgia">Georgia</option>
    <option value="Courier New">Courier New</option>
  </select>
  <div class="tb-sep"></div>

  <span class="tb-label">Export</span>
  <button class="tb-btn" id="btn-export-svg">Save SVG</button>
  <button class="tb-btn" id="btn-export-pptx">PPTXExport</button>
  <button class="tb-btn" id="btn-save-json">Save JSON</button>
  <button class="tb-btn" id="btn-save-selection-json">Save Selection</button>
  <button class="tb-btn" id="btn-save-selection-svg">Selection SVG</button>
  <button class="tb-btn" id="btn-load-json">Load JSON</button>
  <input type="file" id="json-file-input" accept=".json" style="display:none">
</div>

<div id="main">
  <div id="canvas-container">
    <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="panel-container">
    <p class="panel-empty">Please select a node or edge</p>
  </div>
</div>

<div id="statusbar">Nodes: 0 / Edges: 0</div>

<textarea id="inline-edit"></textarea>
<div id="inline-toolbar" style="position:fixed;display:none;flex-direction:row;gap:4px;padding:3px 6px;background:white;border:1px solid #e2e8f0;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:201;align-items:center;">
  <button id="itb-sub" style="padding:2px 8px;font-size:12px;border:1px solid #e2e8f0;border-radius:4px;background:white;cursor:pointer;color:#334155;" title="下付き文字 (0–9, +/-)">x<sub>n</sub></button>
  <button id="itb-sup" style="padding:2px 8px;font-size:12px;border:1px solid #e2e8f0;border-radius:4px;background:white;cursor:pointer;color:#334155;" title="上付き文字 (0–9, +/-)">x<sup>n</sup></button>
</div>
</body>
</html>
